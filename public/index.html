<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presupuesto</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Presupuesto</p>
      <h1>Semana o mes</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vanilla JS · Mongo</p><h1>Presupuesto</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <nav id="periods" class="tabs"></nav>
      <section class="totals"><article><span>Ingresos</span><strong id="income">$ 0</strong></article><article><span>Egresos</span><strong id="expense">$ 0</strong></article><article><span>Saldo</span><strong id="balance">$ 0</strong></article></section>
      <form id="limit-form" class="card form">
        <input id="limit-category" placeholder="Categoria" maxlength="24" required />
        <input id="limit-amount" type="number" min="1" step="0.01" placeholder="Limite" required />
        <button class="primary" type="submit">Fijar limite</button>
      </form>
      <div id="categories"></div>
      <form id="move-form" class="card form">
        <input id="title" placeholder="Concepto" maxlength="80" required />
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Monto" required />
        <select id="kind"><option value="egreso">Egreso</option><option value="ingreso">Ingreso</option></select>
        <input id="category" placeholder="Categoria" maxlength="24" />
        <button class="primary" type="submit">Agregar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
